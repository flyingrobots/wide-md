[package]
name = "wide-md"
version = "0.1.0"
edition = "2024"
description = "Remove artificial hard wrapping from Markdown"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
globset = "0.4.20"
ignore = "0.4.33"
pulldown-cmark = { version = "0.13.4", default-features = false }
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
similar = "3.2.0"
tempfile = "3.27.0"
toml = "1.1.4"
unicode-width = "0.2.2"

[lib]
name = "wide_md"
path = "src/lib.rs"

[[bin]]
name = "wide-md"
path = "src/main.rs"
